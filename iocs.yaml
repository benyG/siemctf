{% extends "base.html" %}
{% block content %}
<div class="banner">Scenario actif: <strong>{{ scenario.name }}</strong></div>
<div class="panel">
  <h1>Alerts</h1>
  <table>
    <thead><tr><th>ID</th><th>Rule</th><th>Title</th><th>Severity</th><th>Status</th><th>Event</th><th>Created</th></tr></thead>
    <tbody>
    {% for a in alerts %}
      <tr>
        <td>{{ a.id }}</td>
        <td class="mono">{{ a.rule_id }}</td>
        <td>{{ a.title }}</td>
        <td><span class="sev-{{ a.severity }}">{{ a.severity }}</span></td>
        <td>{{ a.status }}</td>
        <td>{{ a.event_id }}</td>
        <td>{{ a.created_at }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
