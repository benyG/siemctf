{% extends "base.html" %}
{% block content %}
<div class="banner">Scenario actif: <strong>{{ scenario.name }}</strong></div>
<div class="panel">
  <h1>Events</h1>
  <form method="get" action="/events" style="display:flex;gap:10px;align-items:end;margin-bottom:14px;flex-wrap:wrap;">
    <input type="text" name="q" value="{{ q }}" placeholder='source:sysmon AND process_name:powershell.exe' style="min-width:620px;">
    <button type="submit">Search</button>
  </form>

  <div style="margin: 6px 0 14px 0; color:#9fb0c4; font-size: 14px;">
    Mode: <strong>{{ query_meta.mode if query_meta else "pseudo-kql-spl" }}</strong><br>
    Syntaxe: <span class="mono">field:value</span>, <span class="mono">field~contains</span>, joker <span class="mono">*</span>, opérateurs <span class="mono">AND</span> / <span class="mono">OR</span> / <span class="mono">NOT</span>, parenthèses <span class="mono">( )</span>, texte libre entre guillemets.
  </div>

  <div class="panel" style="margin-bottom:14px;">
    <strong>Exemples</strong>
    <ul style="margin:8px 0 0 16px;">
    {% for ex in examples %}
      <li><a href="/events?q={{ ex|urlencode }}">{{ ex }}</a></li>
    {% endfor %}
    </ul>
  </div>

  <table>
    <thead><tr><th>ID</th><th>Timestamp</th><th>Source</th><th>Type</th><th>Host</th><th>User</th><th>IPs</th><th>Process</th><th>Parse</th><th>IOC</th><th>Message</th></tr></thead>
    <tbody>
    {% for e in events %}
      <tr>
        <td>{{ e.id }}</td>
        <td class="mono">{{ e.timestamp }}</td>
        <td><a href="/events?q=source:{{ e.source }}">{{ e.source }}</a></td>
        <td>{{ e.event_type }}</td>
        <td>{% if e.hostname %}<a href="/events?q=hostname:{{ e.hostname }}">{{ e.hostname }}</a>{% endif %}</td>
        <td>{% if e.username %}<a href="/events?q=username:{{ e.username }}">{{ e.username }}</a>{% endif %}</td>
        <td class="mono">{{ e.src_ip or "" }}{% if e.dst_ip %} → {{ e.dst_ip }}{% endif %}</td>
        <td class="mono">{{ e.process_name or "" }}</td>
        <td>{{ e.parse_status }} ({{ e.parse_confidence }})</td>
        <td class="mono">{{ e.ioc_match or "" }}</td>
        <td>{{ e.message }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
